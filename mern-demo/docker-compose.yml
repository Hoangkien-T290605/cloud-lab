services:
  backend:
    image: kientrandinhhoang/mern-backend:1.0
    container_name: mern-backend
    network_mode: host
    environment:
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI}

  frontend:
    image: kientrandinhhoang/mern-frontend:2.0
    ports:
      - "5173:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend